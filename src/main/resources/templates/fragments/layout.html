<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Готові обіди для офісу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Шапка -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🍱 Готові обіди</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/menu}">Меню</a>
                </li>
                <li class="nav-item" th:if="${userRole == null or userRole == 'CLIENT'}">
                    <a class="nav-link" th:href="@{/cart}">Кошик
                        <span class="badge rounded-pill text-bg-light"
                              th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}">0</span>
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser != null}">
                    <a class="nav-link" th:href="@{/profile}">Профіль</a>
                </li>
                <li class="nav-item" th:if="${userRole == 'COLLECTOR_MANAGER'}">
                    <a class="nav-link" th:href="@{/collector/rooms}">Групові замовлення</a>
                </li>
                <li class="nav-item" th:if="${userRole == 'ORDER_MANAGER'}">
                    <a class="nav-link" th:href="@{/manager/orders}">Замовлення</a>
                </li>
                <li class="nav-item" th:if="${userRole == 'ORDER_MANAGER'}">
                    <a class="nav-link" th:href="@{/manager/menu}">Керування меню</a>
                </li>
                <li class="nav-item" th:if="${userRole == null or userRole == 'CLIENT'}">
                    <a class="nav-link" th:href="@{/join}">Приєднатися до групи</a>
                </li>
                <li class="nav-item" th:if="${userRole == 'COURIER'}">
                    <a class="nav-link" th:href="@{/courier/deliveries}">Мої доставки</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <th:block th:if="${currentUser == null}">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Увійти</a>
                    <a class="btn btn-light btn-sm" th:href="@{/register}">Реєстрація</a>
                </th:block>
                <th:block th:if="${currentUser != null}">
                    <span class="navbar-text text-white small" th:text="${currentUser}">user</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">Вийти</button>
                    </form>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<!-- Вміст сторінки -->
<main class="container flex-grow-1 py-4">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- Підвал -->
<footer class="bg-light border-top py-3 mt-auto">
    <div class="container text-center text-muted small">
        © 2026 Готові обіди для офісу
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
