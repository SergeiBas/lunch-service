<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Вхід — Готові обіди</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <h2 class="mb-4">Вхід</h2>

            <div class="alert alert-success" th:if="${param.registered}">
                Реєстрацію завершено. Тепер можна увійти.
            </div>
            <div class="alert alert-danger" th:if="${param.error}">
                Невірний email або пароль.
            </div>
            <div class="alert alert-info" th:if="${param.logout}">
                Ви вийшли з системи.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Email</label>
                    <input type="email" id="username" name="username" class="form-control"
                           required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" id="password" name="password" class="form-control"
                           required>
                </div>
                <button type="submit" class="btn btn-success w-100">Увійти</button>
            </form>

            <p class="mt-3 text-center">
                Немає акаунта? <a th:href="@{/register}">Зареєструватися</a>
            </p>
        </div>
    </div>
</section>
</body>
</html>
