<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Реєстрація — Готові обіди</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h2 class="mb-4">Реєстрація</h2>

            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="fullName">Ім'я</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Підтвердження пароля</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="role">Роль</label>
                    <select id="role" th:field="*{role}" class="form-select"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                        <option value="CLIENT">Клієнт</option>
                        <option value="COLLECTOR_MANAGER">Менеджер збору замовлень</option>
                        <option value="ORDER_MANAGER">Менеджер прийому замовлень</option>
                        <option value="COURIER">Кур'єр</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}"></div>
                </div>

                <button type="submit" class="btn btn-success w-100">Зареєструватися</button>
            </form>

            <p class="mt-3 text-center">
                Уже є акаунт? <a th:href="@{/login}">Увійти</a>
            </p>
        </div>
    </div>
</section>
</body>
</html>
