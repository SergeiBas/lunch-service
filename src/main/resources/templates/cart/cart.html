<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Кошик — Готові обіди</title>
</head>
<body>
<section>
    <h2 class="mb-4">Кошик</h2>

    <div class="text-center py-5" th:if="${#lists.isEmpty(lines)}">
        <p class="text-muted fs-5">Кошик порожній.</p>
        <a class="btn btn-success" th:href="@{/menu}">До меню</a>
    </div>

    <th:block th:unless="${#lists.isEmpty(lines)}">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Страва</th>
                    <th class="text-end">Ціна</th>
                    <th style="width: 200px">Кількість</th>
                    <th class="text-end">Сума</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${lines}">
                    <td th:text="${l.dish.name}">Назва</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(l.dish.price, 1, 2)}">0.00</td>
                    <td>
                        <form th:action="@{/cart/update/{id}(id=${l.dish.id})}" method="post" class="d-flex gap-2">
                            <input type="number" name="quantity" min="1" max="99"
                                   th:value="${l.quantity}" class="form-control form-control-sm">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Оновити</button>
                        </form>
                    </td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(l.lineTotal, 1, 2)}">0.00</td>
                    <td class="text-end">
                        <form th:action="@{/cart/remove/{id}(id=${l.dish.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Видалити</button>
                        </form>
                    </td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3" class="text-end">Разом, грн:</th>
                    <th class="text-end fs-5" th:text="${#numbers.formatDecimal(subtotal, 1, 2)}">0.00</th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-outline-secondary" th:href="@{/menu}">Додати ще страви</a>
            <a class="btn btn-success" th:href="@{/cart/checkout}">Оформити замовлення</a>
        </div>
    </th:block>
</section>
</body>
</html>
