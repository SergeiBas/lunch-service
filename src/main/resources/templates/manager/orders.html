<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Замовлення — Готові обіди</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Замовлення</h2>
        <span class="badge text-bg-warning fs-6" th:if="${newCount > 0}">
            Нових: <span th:text="${newCount}">0</span>
        </span>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(orders)}">Замовлень поки що немає.</p>

    <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>№</th><th>Створено</th><th>Тип</th><th>Клієнт</th>
                <th class="text-end">Сума, грн</th><th>Статус</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}" th:classappend="${o.status.name() == 'NEW'} ? 'table-warning'">
                <td th:text="${o.id}">1</td>
                <td class="small" th:text="${o.createdAt}">2026-11-27</td>
                <td th:text="${o.groupOrderId != null} ? 'Групове' : 'Разове'">Разове</td>
                <td th:text="${o.guestName} ?: 'Зареєстрований клієнт'">Клієнт</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(o.total, 1, 2)}">0.00</td>
                <td>
                    <span class="badge"
                          th:classappend="${o.status.name() == 'NEW'} ? 'text-bg-warning'
                              : (${o.status.name() == 'REJECTED'} ? 'text-bg-danger'
                              : (${o.status.name() == 'COMPLETED'} ? 'text-bg-success' : 'text-bg-primary'))"
                          th:text="${o.status.label}">Статус</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/manager/orders/{id}(id=${o.id})}">Відкрити</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
