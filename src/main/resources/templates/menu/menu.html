<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Меню — Готові обіди</title>
</head>
<body>
<section>
    <h2 class="mb-4">Меню</h2>
    <div class="alert alert-success" th:if="${message}" th:text="${message}">Повідомлення</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Помилка</div>

    <!-- Фільтри -->
    <form th:action="@{/menu}" th:object="${filter}" method="get" class="card card-body mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" for="categoryId">Категорія</label>
                <select id="categoryId" th:field="*{categoryId}" class="form-select">
                    <option value="">Усі</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Категорія</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="minPrice">Ціна від</label>
                <input type="number" id="minPrice" th:field="*{minPrice}" class="form-control" min="0" step="1">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="maxPrice">Ціна до</label>
                <input type="number" id="maxPrice" th:field="*{maxPrice}" class="form-control" min="0" step="1">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="diet">Дієтична мітка</label>
                <select id="diet" th:field="*{diet}" class="form-select">
                    <option value="">Будь-яка</option>
                    <option th:each="l : ${dietLabels}" th:value="${l}" th:text="${l}">мітка</option>
                </select>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Без алергенів</label>
                <div class="form-check form-check-inline" th:each="a : ${allergens}">
                    <input class="form-check-input" type="checkbox"
                           th:field="*{excludeAllergenIds}" th:value="${a.id}">
                    <label class="form-check-label"
                           th:for="${#ids.prev('excludeAllergenIds')}" th:text="${a.name}">Алерген</label>
                </div>
            </div>

            <div class="col-12 d-flex flex-wrap align-items-center gap-3">
                <div class="form-check" th:if="${currentUser != null}">
                    <input class="form-check-input" type="checkbox" id="favoritesOnly"
                           th:field="*{favoritesOnly}">
                    <label class="form-check-label" for="favoritesOnly">Лише улюблені</label>
                </div>
                <button type="submit" class="btn btn-success">Застосувати</button>
                <a class="btn btn-outline-secondary" th:href="@{/menu}">Скинути</a>
            </div>
        </div>
    </form>

    <p class="text-muted" th:if="${#lists.isEmpty(dishes)}">
        За вибраними фільтрами страв не знайдено.
    </p>

    <!-- Картки страв -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="d : ${dishes}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="badge text-bg-secondary mb-2" th:text="${d.category.name}">Категорія</span>

                        <form th:if="${currentUser != null}"
                              th:action="@{/favorites/{id}/toggle(id=${d.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-sm btn-link text-danger p-0 fs-4"
                                    th:title="${favoriteIds.contains(d.id)} ? 'Прибрати з улюблених' : 'Додати в улюблені'"
                                    th:text="${favoriteIds.contains(d.id)} ? '♥' : '♡'">♡</button>
                        </form>
                    </div>

                    <h5 class="card-title" th:text="${d.name}">Назва</h5>
                    <p class="card-text mb-1" th:text="${d.description}">Опис</p>
                    <p class="text-muted small mb-2">
                        <strong>Склад:</strong> <span th:text="${d.composition}">склад</span>
                    </p>

                    <div class="mb-2">
                        <span class="badge text-bg-success me-1" th:each="l : ${d.dietLabelList}" th:text="${l}">мітка</span>
                    </div>
                    <div class="mb-3" th:if="${!#sets.isEmpty(d.allergens)}">
                        <span class="small text-muted">Алергени:</span>
                        <span class="badge text-bg-warning me-1" th:each="a : ${d.allergens}" th:text="${a.name}">алерген</span>
                    </div>

                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fs-5 fw-semibold">
                            <span th:text="${#numbers.formatDecimal(d.price, 1, 2)}">0.00</span> грн
                        </span>
                        <form th:action="@{/cart/add/{id}(id=${d.id})}" method="post" class="m-0">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-success btn-sm">У кошик</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
